<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperExpress - 智能化论文速递</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 PaperExpress</h1>
            <p class="subtitle">智能化论文速递</p>
        </header>

        <!-- 服务器状态 -->
        <div class="server-status" id="serverStatus">
            <span class="status-indicator checking"></span>
            <span class="status-text">正在检查服务器连接...</span>
        </div>

        <!-- 配置区 -->
        <section class="config-section" id="configSection">
            <h2>⚙️ 配置</h2>

            <div class="form-group">
                <label>
                    arXiv 学科分类
                    <span class="hint">点击加载完整分类列表</span>
                </label>
                <button type="button" class="btn btn-secondary btn-small" id="loadCategoriesBtn">
                    📋 加载完整学科分类
                </button>
                <div class="checkbox-group hidden" id="categoryContainer">
                    <input type="text" class="category-search" id="categorySearch" placeholder="🔍 搜索分类..." style="display: none; width: 100%; margin-bottom: 12px; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px;">
                    <div class="loading-text">正在加载分类...</div>
                </div>
                <div class="selected-categories" id="selectedCategories">
                    <span class="empty">未选择分类，点击上方按钮加载</span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="timeRange">时间范围</label>
                    <select id="timeRange">
                        <option value="1">最近 1 天</option>
                        <option value="3" selected>最近 3 天</option>
                        <option value="7">最近 7 天</option>
                        <option value="14">最近 14 天</option>
                        <option value="30">最近 30 天</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="maxPapers">最大论文数</label>
                    <select id="maxPapers">
                        <option value="10">10 篇</option>
                        <option value="20" selected>20 篇</option>
                        <option value="30">30 篇</option>
                        <option value="50">50 篇</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="concurrency">并发数</label>
                    <select id="concurrency">
                        <option value="1">1 并发</option>
                        <option value="2">2 并发</option>
                        <option value="3" selected>3 并发</option>
                        <option value="5">5 并发</option>
                        <option value="8">8 并发</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="config-header">
                    <label>LLM 配置 (OpenAI 兼容格式)</label>
                    <div class="header-buttons">
                        <button type="button" class="btn btn-secondary btn-small" id="loadConfigBtn">
                            📂 加载配置
                        </button>
                        <button type="button" class="btn btn-secondary btn-small" id="testConnectionBtn">
                            🔗 测试连接
                        </button>
                    </div>
                </div>
                <input type="url" id="llmEndpoint" placeholder="API BaseURL">
                <div class="hint-text">例如：https://api.openai.com/v1 或 https://ark.cn-beijing.volces.com/api/coding/v3</div>
                <input type="password" id="llmKey" placeholder="API Key" autocomplete="off">
                <input type="text" id="llmModel" placeholder="模型名称 (如: gpt-4o-mini)">
                <div class="test-result-container">
                    <div class="test-result" id="testResult"></div>
                </div>
            </div>

            <button class="btn btn-primary" id="startBtn" disabled>
                🚀 开始生成论文速递
            </button>

            <button type="button" class="btn btn-secondary" id="homeHistoryBtn" style="margin-top: 12px; width: 100%;">
                📋 查看历史记录
            </button>
        </section>

        <!-- 进度区 -->
        <section class="progress-section hidden" id="progressSection">
            <div class="progress-header">
                <h2>⏳ 处理中...</h2>
                <span class="progress-status" id="progressStatus">正在获取论文数据</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-details" id="progressDetails"></div>
        </section>

        <!-- 结果区 -->
        <section class="results-section hidden" id="resultsSection">
            <div class="results-header">
                <h2>📰 论文速递报告</h2>
                <div class="results-actions">
                    <button class="btn btn-secondary" id="backBtn">← 返回配置</button>
                    <button class="btn btn-primary" id="exportBtn">📥 导出 Markdown</button>
                </div>
            </div>
            <div class="results-meta" id="resultsMeta"></div>
            <div class="stats-panel" id="statsPanel" style="display: none; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                <h3 style="margin: 0 0 15px 0; font-size: 1rem;">📊 翻译统计</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;">
                    <div style="background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: 700;" id="statModel">-</div>
                        <div style="font-size: 0.75rem; opacity: 0.9;">模型</div>
                    </div>
                    <div style="background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: 700;" id="statTotalTokens">0</div>
                        <div style="font-size: 0.75rem; opacity: 0.9;">总 Tokens</div>
                    </div>
                    <div style="background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: 700;" id="statTotalTime">0s</div>
                        <div style="font-size: 0.75rem; opacity: 0.9;">总耗时</div>
                    </div>
                    <div style="background: rgba(255,255,255,0.15); padding: 12px; border-radius: 8px; text-align: center;">
                        <div style="font-size: 1.5rem; font-weight: 700;" id="statAvgTime">0s</div>
                        <div style="font-size: 0.75rem; opacity: 0.9;">平均每篇</div>
                    </div>
                </div>
            </div>
            <div class="papers-container" id="papersContainer"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="app.js"></script>

    <!-- 精读弹窗 -->
    <div id="intensiveReadModal" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-header-content">
                    <h3 id="modalTitle">📖 论文精读</h3>
                    <div class="modal-processing hidden" id="modalProcessing">
                        <span class="processing-dot"></span>
                        <span class="processing-dot"></span>
                        <span class="processing-dot"></span>
                    </div>
                </div>
                <button class="modal-close" onclick="closeIntensiveReadModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="modal-loading" id="modalLoading">
                    <div class="loading-spinner"></div>
                    <p>正在分析论文，请稍候...</p>
                    <p class="loading-hint">（论文精读需要较长时间，请耐心等待）</p>
                </div>
                <div class="modal-content hidden" id="modalContent"></div>
                <div class="modal-error hidden" id="modalError"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-small" onclick="closeIntensiveReadModal()">关闭</button>
                <button class="btn btn-primary btn-small" onclick="exportIntensiveRead()">📥 导出精读结果</button>
            </div>
        </div>
    </div>

    <!-- 历史记录弹窗 -->
    <div id="historyModal" class="modal-overlay hidden">
        <div class="modal-container">
            <div class="modal-header" style="background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);">
                <h3>📋 历史记录</h3>
                <button class="modal-close" onclick="closeHistoryModal()">&times;</button>
            </div>
            <div class="modal-body" id="historyModalBody">
                <div class="modal-loading" id="historyLoading">
                    <div class="loading-spinner"></div>
                    <p>正在加载历史记录...</p>
                </div>
                <div class="history-content hidden" id="historyContent"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-small" onclick="closeHistoryModal()">关闭</button>
            </div>
        </div>
    </div>
</body>
</html>
